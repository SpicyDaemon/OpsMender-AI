[project]
name = "opsmender"
version = "1.2.0"
description = "OpsMender AI — open-source AI incident manager / AI SRE / AI on-call. Tier-gated, MCP-first, human-in-the-loop AI incident response for production infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SpicyDaemon"}]
keywords = [
    "ai-incident-manager", "ai-incident-response", "ai-sre", "ai-oncall",
    "incident-management", "incident-response", "sre", "devops",
    "mcp", "langgraph", "llm", "agents", "ai-ops", "runbook-automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.0",
    "langgraph>=0.2",
    "anthropic>=0.93.0",
    "openai>=1.99.0",
    "boto3>=1.43.0",
    "google-cloud-aiplatform>=1.126.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3",
    "pyjwt[crypto]>=2.10",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 is unmaintained and breaks on bcrypt >= 4.1 (its init
    # probe sends a >72-byte test password that bcrypt 5.x rejects with
    # a hard ValueError, so /auth/login silently returns 401 for valid
    # credentials). Pin bcrypt to the last compatible major until passlib
    # 1.8 ships or we migrate off passlib.
    "bcrypt<4.1",
    "websockets>=15.0",
    "tzdata>=2025.2",
    # SAML 2.0 SP support (Sprint 30). Pulls in xmlsec / lxml — requires
    # libxmlsec1 + libxml2 native libs at runtime. The Docker image installs
    # these; PyInstaller builds fail-loud if they are missing on the host.
    "python3-saml>=1.16.0",
    "reportlab>=4.4.0",
]

[project.scripts]
opsmender = "cli.opsmender:main"

[project.urls]
Homepage = "https://github.com/SpicyDaemon/OpsMender-AI"
Repository = "https://github.com/SpicyDaemon/OpsMender-AI"
Issues = "https://github.com/SpicyDaemon/OpsMender-AI/issues"
Changelog = "https://github.com/SpicyDaemon/OpsMender-AI/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "backend"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pylint",
    "black",
    "mypy",
    "aiosqlite",
    "httpx",
    # Used by scripts/combine_screenshots.py to build the composite
    # review images from the per-route captures.
    "Pillow",
]
build = [
    "pyinstaller>=6.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live integration tests requiring K8s cluster + MCP server",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py311"]
