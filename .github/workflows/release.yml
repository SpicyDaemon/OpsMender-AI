name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------------------
  # Docker image → GitHub Container Registry (ghcr.io/<owner>/<repo>)
  # -------------------------------------------------------------------------
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.ref.outputs.ref }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=opsmender-ai
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ref.outputs.ref }}
            org.opencontainers.image.licenses=MIT

  # -------------------------------------------------------------------------
  # macOS PyInstaller binary
  # -------------------------------------------------------------------------
  macos-binary:
    name: Build macOS binary
    runs-on: macos-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build binary
        run: bash scripts/build_binary.sh

      - name: Smoke test binary
        run: ./dist/opsmender --version

      - name: Package binary
        id: package
        run: |
          cd dist
          ARCH="$(uname -m)"
          ARCHIVE="opsmender-${{ steps.ref.outputs.ref }}-darwin-${ARCH}.tar.gz"
          tar -czf "$ARCHIVE" opsmender
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsmender-darwin
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

  # -------------------------------------------------------------------------
  # Source tarball + GitHub Release
  # -------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, macos-binary]
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Create source tarball
        run: |
          VERSION="${{ steps.ref.outputs.ref }}"
          git archive --format=tar.gz --prefix="ai-incident-manager-${VERSION}/" \
            -o "ai-incident-manager-${VERSION}-source.tar.gz" "${VERSION}"
          sha256sum "ai-incident-manager-${VERSION}-source.tar.gz" \
            > "ai-incident-manager-${VERSION}-source.tar.gz.sha256"

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: opsmender-darwin
          path: artifacts/

      - name: Extract release notes
        id: notes
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          python - <<'PY' > release-notes.md
          import os, pathlib, re
          ref = os.environ['REF']
          version = ref.lstrip('v')
          text = pathlib.Path('CHANGELOG.md').read_text()
          pattern = rf'##\s*\[{re.escape(version)}\].*?(?=\n##\s|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          if match:
              print(match.group(0).strip())
          else:
              print(f'Release {ref}')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.ref }}
          name: ${{ steps.ref.outputs.ref }}
          body_path: release-notes.md
          files: |
            ai-incident-manager-*.tar.gz
            ai-incident-manager-*.tar.gz.sha256
            artifacts/*
