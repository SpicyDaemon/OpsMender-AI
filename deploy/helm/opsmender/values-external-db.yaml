## Example: deploy OpsMender against an externally managed Postgres
## Usage:
##   helm install opsmender ./deploy/helm/opsmender -f values-external-db.yaml \
##     --set externalDatabase.url='postgresql+asyncpg://user:pass@db.example.com:5432/opsmender' \
##     --set secrets.OPSMENDER_JWT_SECRET=$(openssl rand -hex 32)

postgresql:
  enabled: false

externalDatabase:
  # Inline (use --set on the command line, do not commit credentials)
  url: ""
  # Or reference an existing Secret:
  # existingSecret: opsmender-db
  # existingSecretKey: OPSMENDER_DATABASE_URL

persistence:
  enabled: true
  size: 5Gi
