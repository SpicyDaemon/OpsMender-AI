  <text x="36" y="81" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#64748b">Incidents</text>
  <rect x="12" y="95" width="196" height="32" rx="6" fill="#3b82f6" fill-opacity="0.12"/>
