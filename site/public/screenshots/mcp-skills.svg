  <text x="860" y="244" font-family="mono,sans-serif" font-size="10" fill="#475569">draft</text>
  <rect x="998" y="226" width="64" height="22" rx="4" fill="#1a2540" stroke="#2d3f5a" stroke-width="1"/>
