name: CodeQL

# CodeQL uploads results to GitHub code scanning, which requires GitHub Advanced
# Security on PRIVATE repositories (a paid feature; free only on public repos).
# This repo is private without GHAS, so automatic push/schedule runs always fail
# at the upload step ("Code scanning is not enabled for this repository").
# The triggers are therefore manual-only. When the repo is made public (or GHAS
# code scanning is enabled: Settings → Code security → Code scanning → Advanced),
# restore automatic analysis by replacing the `on:` block below with:
#   on:
#     push:            { branches: [main] }
#     pull_request:    { branches: [main] }
#     schedule:        [{ cron: '30 5 * * 1' }]
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
