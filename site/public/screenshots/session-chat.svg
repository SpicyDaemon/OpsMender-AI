  <rect x="286" y="378" width="580" height="44" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1"/>
  <text x="302" y="404" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#bfdbfe">What was the p99 before and after the deploy?</text>
  <rect x="826" y="386" width="36" height="28" rx="6" fill="#2d3f5a"/>
  <text x="844" y="405" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">A</text>

  <!-- AI message 3 -->
  <rect x="240" y="436" width="36" height="36" rx="8" fill="#1e3a5f"/>
  <text x="258" y="459" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">AI</text>
  <rect x="286" y="436" width="580" height="80" rx="8" fill="#111827" stroke="#1a2540" stroke-width="1"/>
  <text x="302" y="456" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">From the metrics I observed via query_metrics:</text>
  <text x="302" y="476" font-family="mono,sans-serif" font-size="11" fill="#86efac">  Pre-deploy  (14:28–14:32): p99 = 42ms</text>
  <text x="302" y="494" font-family="mono,sans-serif" font-size="11" fill="#fca5a5">  Post-deploy (14:32–14:50): p99 = 1,840ms  ← spike</text>

