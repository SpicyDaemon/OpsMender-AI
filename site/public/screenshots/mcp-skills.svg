  <text x="660" y="188" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#64748b">all servers</text>
  <text x="860" y="176" font-family="mono,sans-serif" font-size="10" fill="#22c55e">12 safe</text>
  <text x="860" y="192" font-family="mono,sans-serif" font-size="10" fill="#eab308">3 caution</text>
  <text x="860" y="208" font-family="mono,sans-serif" font-size="10" fill="#ef4444">2 destructive</text>
  <rect x="998" y="170" width="64" height="22" rx="4" fill="#1a2540" stroke="#2d3f5a" stroke-width="1"/>
  <text x="1030" y="186" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Edit</text>
  <rect x="1070" y="170" width="80" height="22" rx="4" fill="#1a2540" stroke="#2d3f5a" stroke-width="1"/>
  <text x="1110" y="186" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Download</text>

