# AI Incident Manager — Default Configuration
#
# MCP Servers
# -----------
# Each entry defines an MCP server the agent can connect to.
#
#   transport: "stdio", "sse", or "http"
#
#   stdio  — launches a local subprocess
#     command:   executable to run
#     args:      list of arguments (optional)
#     env:       extra environment variables passed to the process (optional)
#
#   sse    — connects via Server-Sent Events
#     url:       server URL (e.g. http://localhost:8080/sse)
#     token:     bearer token for authentication (optional)
#
#   http   — connects via streamable HTTP (used by Sourcebot, etc.)
#     url:       server URL (e.g. https://sb.example.com/api/mcp)
#     token:     bearer token for authentication (optional)
#
# To add a server, append an entry under mcp_servers below.
# Example — local Kubernetes MCP server (stdio):
#
#   - name: kubernetes
#     transport: stdio
#     command: "npx"
#     args: ["-y", "@anthropic/mcp-server-k8s"]
#
# Example — remote MCP server (sse-legacy):
#
#   - name: remote-k8s
#     transport: sse
#     url: "http://mcp.internal:8080/sse"
#
# Example — Sourcebot or other HTTP MCP server (Streamable HTTP):
#
#   - name: sourcebot
#     transport: http
#     url: "https://sb.example.com/api/mcp"
#     token: "your-bearer-token-here"

mcp_servers: []

tiers:
  default: 2

logging:
  level: "INFO"
