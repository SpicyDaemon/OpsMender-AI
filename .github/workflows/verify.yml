name: Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to verify
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --group dev

      # Known vulnerabilities in the installed runtime and dev packages,
      # checked against OSV. pip-audit fails on any finding, so each ignore
      # below names its reason; drop it when its package ships a fix.
      # - GHSA-3qf3-8w2g-rqmx, python-jose 3.5.0, critical, no fixed release:
      #   a forged HS256 token passes only a decode that does not name its
      #   algorithms, and every decode names them since M1-58.
      # - GHSA-wj6h-64fc-37mp, ecdsa 0.19.2 (required by python-jose), high,
      #   no fix planned: a timing leak while signing with P-256. OpsMender
      #   never signs with ecdsa; python-jose uses its cryptography backend.
      # - GHSA-84m7-p3x7-pcfv, mcp 1.28.1, unbounded sessions in a Streamable
      #   HTTP MCP server: OpsMender only connects to MCP servers as a client and
      #   never serves MCP. The fixed 1.30.0 also changes client redirect and
      #   OAuth handling, so moving to it is its own change.
      - name: Audit Python dependencies
        run: >-
          uv run pip-audit --skip-editable --vulnerability-service osv
          --ignore-vuln GHSA-3qf3-8w2g-rqmx
          --ignore-vuln GHSA-wj6h-64fc-37mp
          --ignore-vuln GHSA-84m7-p3x7-pcfv

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run backend tests
        run: uv run pytest -m "not integration" --timeout=180 --timeout-method=thread

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsmender
          POSTGRES_PASSWORD: opsmender-ci
          POSTGRES_DB: opsmender
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsmender -d opsmender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OPSMENDER_DATABASE_URL: postgresql+asyncpg://opsmender:opsmender-ci@localhost:5432/opsmender
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Assert one migration head
        shell: bash
        run: |
          heads="$(uv run alembic heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          test "$count" -eq 1

      - name: Upgrade an empty database
        run: uv run alembic upgrade head

      # The models and the migrations must describe the same schema (M1-47).
      - name: Check the models match the migrations
        run: uv run alembic check

      - name: Install test dependencies
        run: uv sync --frozen --group dev

      # Real two-connection races and audit rollbacks on this job's Postgres
      # service. They need a live database, so the main backend run
      # deselects them.
      - name: Postgres concurrency tests
        shell: bash
        # A failed interleaving can leave a lock held through teardown.
        timeout-minutes: 5
        run: >-
          PART4_PG_URL="$OPSMENDER_DATABASE_URL"
          uv run pytest -m integration --run-integration
          tests/test_escalation_part4_postgres.py
          tests/test_admin_audit_postgres.py
          tests/test_notification_stage_claims_postgres.py
          tests/test_responder_slots_postgres.py
          tests/test_race_answers_postgres.py
          tests/test_sla_api.py
          tests/test_voice_settings.py
          -q --timeout=180 --timeout-method=thread

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Known vulnerabilities in the runtime tree (next and what it pulls in);
      # dev tooling is left out. High or critical fails the job. npm audit has
      # no ignore list, so a finding is cleared by upgrading.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      # The design audit's pass/fail rules, without a browser.
      - name: Design gate rules
        run: node --test ../scripts/design_audit_gate.test.mjs

      - name: Build
        run: npm run build

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Build image
        run: docker build --file docker/Dockerfile --tag opsmender:ci .

      - name: Boot and smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker network create opsmender-ci
          cleanup() {
            docker rm -f opsmender-ci-app opsmender-ci-db >/dev/null 2>&1 || true
            docker network rm opsmender-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name opsmender-ci-db --network opsmender-ci \
            --env POSTGRES_USER=opsmender \
            --env POSTGRES_PASSWORD=opsmender-ci \
            --env POSTGRES_DB=opsmender \
            postgres:16-alpine
          for attempt in {1..30}; do
            if docker exec opsmender-ci-db pg_isready -U opsmender -d opsmender; then
              break
            fi
            test "$attempt" -lt 30
            sleep 2
          done

          docker run --detach --name opsmender-ci-app --network opsmender-ci \
            --publish 8000:8000 \
            --env OPSMENDER_DEPLOYMENT_MODE=monolith \
            --env OPSMENDER_ENVIRONMENT=production \
            --env OPSMENDER_DATABASE_URL=postgresql+asyncpg://opsmender:opsmender-ci@opsmender-ci-db:5432/opsmender \
            --env OPSMENDER_JWT_SECRET=ci-only-release-verification-secret-000000000000000000000000 \
            --env OPSMENDER_BOOTSTRAP_ADMIN_EMAIL=smoke@example.com \
            --env OPSMENDER_BOOTSTRAP_ADMIN_PASSWORD=SmokeVerification2026 \
            opsmender:ci

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              break
            fi
            if ! docker ps --filter name=opsmender-ci-app --filter status=running --quiet | grep -q .; then
              docker logs opsmender-ci-app
              exit 1
            fi
            test "$attempt" -lt 60 || { docker logs opsmender-ci-app; exit 1; }
            sleep 3
          done

          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
          token="$(curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"username":"smoke@example.com","password":"SmokeVerification2026"}' \
            http://127.0.0.1:8000/auth/login \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          curl --fail --silent \
            --header "Authorization: Bearer $token" \
            http://127.0.0.1:8000/incidents

          # The static export as the Next.js router asks for it: the HEAD
          # probe before a prefetch, a navigation payload served as
          # text/x-component, a segment prefetch file, and a miss.
          curl --fail --silent --head http://127.0.0.1:8000/dashboard/incidents >/dev/null
          payload_type="$(curl --fail --silent --output /dev/null --write-out '%{content_type}' http://127.0.0.1:8000/login.txt)"
          case "$payload_type" in
            text/x-component*) ;;
            *) echo "login.txt served as $payload_type"; exit 1 ;;
          esac
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/dashboard/incidents/__next._tree.txt
          miss="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/dashboard/incidents/__next.nope.txt)"
          test "$miss" = 404
