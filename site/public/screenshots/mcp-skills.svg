  <text x="258" y="200" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#64748b">Global fallback — applies to all unassigned servers</text>
  <rect x="476" y="169" width="96" height="20" rx="10" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
