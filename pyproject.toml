[project]
name = "ai-incident-manager"
version = "0.1.0"
description = "AI Incident Manager - CLI and backend scaffolding"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
aim = "cli.aim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "backend"]

[dependency-groups]
dev = [
    "pytest",
    "pylint",
    "black",
    "mypy",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py311"]
