  <rect x="476" y="225" width="80" height="20" rx="10" fill="#475569" fill-opacity="0.15" stroke="#475569" stroke-opacity="0.3" stroke-width="1"/>
  <text x="516" y="239" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Unassigned</text>
