name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # Cross-platform PyInstaller binaries (Linux x64, Windows x64)
  # Each archive ships with a matching .sha256 file.
  # macOS is intentionally skipped — GitHub-hosted macOS runners are slow
  # and queue-prone; re-add a `macos-*` matrix entry when there's a real
  # operator ask.
  # -------------------------------------------------------------------------
  binary:
    name: Build ${{ matrix.label }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            platform: linux
            ext: ''
            archive_ext: tar.gz
          - os: windows-latest
            label: windows-x64
            platform: windows
            ext: '.exe'
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build binary (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: bash scripts/build_binary.sh

      - name: Build binary (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location
          uv sync --group build
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          uv run pyinstaller opsmender.spec

      - name: Smoke test binary
        shell: bash
        run: ./dist/opsmender${{ matrix.ext }} --version

      - name: Package binary (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        id: package_tar
        run: |
          cd dist
          ARCHIVE="opsmender-${{ steps.ref.outputs.ref }}-${{ matrix.label }}.tar.gz"
          tar -czf "$ARCHIVE" opsmender
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi
          echo "archive=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Package binary (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        id: package_zip
        run: |
          Set-Location dist
          $archive = "opsmender-${{ steps.ref.outputs.ref }}-${{ matrix.label }}.zip"
          Compress-Archive -Path opsmender.exe -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
          "archive=dist/$archive" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          "checksum=dist/$archive.sha256" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsmender-${{ matrix.label }}
          path: |
            dist/opsmender-*.tar.gz
            dist/opsmender-*.tar.gz.sha256
            dist/opsmender-*.zip
            dist/opsmender-*.zip.sha256
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Source tarball + GitHub Release
  # Depends only on the binary job — Docker is decoupled, so a Docker
  # failure does not block publishing the release assets.
  # -------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [binary]
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Create source tarball
        run: |
          VERSION="${{ steps.ref.outputs.ref }}"
          git archive --format=tar.gz --prefix="opsmender-ai-${VERSION}/" \
            -o "opsmender-ai-${VERSION}-source.tar.gz" "${VERSION}"
          sha256sum "opsmender-ai-${VERSION}-source.tar.gz" \
            > "opsmender-ai-${VERSION}-source.tar.gz.sha256"

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: opsmender-*
          merge-multiple: true

      - name: Extract release notes
        id: notes
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          python - <<'PY' > release-notes.md
          import os, pathlib, re
          ref = os.environ['REF']
          version = ref.lstrip('v')
          text = pathlib.Path('CHANGELOG.md').read_text()
          pattern = rf'##\s*\[{re.escape(version)}\].*?(?=\n##\s|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          if match:
              print(match.group(0).strip())
          else:
              print(f'Release {ref}')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.ref }}
          name: ${{ steps.ref.outputs.ref }}
          body_path: release-notes.md
          files: |
            opsmender-ai-*.tar.gz
            opsmender-ai-*.tar.gz.sha256
            artifacts/*
