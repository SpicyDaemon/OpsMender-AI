{{- if not .Values.existingSecret.name -}}
{{/*
  OPSMENDER_JWT_SECRET resolution order:
    1. If the secret already exists in-cluster (helm upgrade), preserve the
       previously-stored value so JWTs issued before the upgrade keep verifying.
    2. Otherwise, if the operator pinned a value in values.yaml
       (.Values.secrets.OPSMENDER_JWT_SECRET), use that.
    3. Otherwise, generate a fresh 64-char random string on first install.
  This matches the OpenClaw / Bitnami pattern — operators never need to run
  `openssl rand -hex 32` by hand, and the secret is stable across upgrades.
*/}}
{{- $secretName := include "opsmender.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $pinnedJwt := "" -}}
{{- if hasKey .Values.secrets "OPSMENDER_JWT_SECRET" -}}
{{- $pinnedJwt = .Values.secrets.OPSMENDER_JWT_SECRET -}}
{{- end -}}
{{- $existingJwt := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "OPSMENDER_JWT_SECRET") -}}
{{- $existingJwt = index $existing.data "OPSMENDER_JWT_SECRET" | b64dec -}}
{{- end -}}
{{- $jwt := "" -}}
{{- if $existingJwt -}}
{{- $jwt = $existingJwt -}}
{{- else if $pinnedJwt -}}
{{- $jwt = $pinnedJwt -}}
{{- else -}}
{{- $jwt = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "opsmender.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPSMENDER_JWT_SECRET: {{ $jwt | quote }}
  {{- range $k, $v := .Values.secrets }}
  {{- if and $v (ne $k "OPSMENDER_JWT_SECRET") }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
  OPSMENDER_DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end -}}
