name: CodeQL

# CodeQL uploads results to GitHub code scanning. That needs Advanced Security
# on private repositories, but is free on public ones. This repo went public on
# 2026-07-07, so automatic analysis is enabled: every push and pull request to
# main, plus a weekly sweep that catches newly published advisories against code
# that has not changed.
#
# If this repo is ever made private again, code scanning uploads will start
# failing with "Code scanning is not enabled for this repository". At that point
# either buy Advanced Security or cut the `on:` block back to `workflow_dispatch`
# alone.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
