services:
  opsmender-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsmender-dev
    volumes:
      # Mount local project into container so edits sync both ways
      - .:/app
      # Persist uv cache between rebuilds
      - uv-cache:/root/.cache/uv
    env_file:
      - .env.example
    stdin_open: true
    tty: true
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsmender
      POSTGRES_PASSWORD: opsmender
      POSTGRES_DB: opsmender
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmender"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uv-cache:
  postgres_data:
