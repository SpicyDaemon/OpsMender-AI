# ─────────────────────────────────────────────────────────────────────────────
# OpsMender AI — Docker Compose
#
# One compose file, dev or production mode is selected via .env:
#
#   Dev (defaults work as-is):
#     OPSMENDER_DEPLOYMENT_MODE=development
#
#   Production (refuses to start without strong values):
#     OPSMENDER_DEPLOYMENT_MODE=production
#     OPSMENDER_JWT_SECRET=<64+ random chars>
#     OPSMENDER_BOOTSTRAP_ADMIN_EMAIL=you@example.com
#     OPSMENDER_BOOTSTRAP_ADMIN_PASSWORD=<strong password>
#
# Open http://localhost:8000 once `app` is healthy.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Postgres ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: opsmender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsmender}
      POSTGRES_DB: opsmender
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmender"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres is reachable only inside the compose network by default.
    # Uncomment to expose 5432 on the host for psql / pgAdmin / migrations.
    # Do NOT enable this on a host reachable from the public internet.
    # ports:
    #   - "5432:5432"

  # ── App (frontend + backend, single container, served on 8000) ────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Empty = frontend calls the backend same-origin. Override only if
        # the frontend is hosted on a different origin than the backend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # OPSMENDER_DATABASE_URL is intentionally NOT set here so the value
      # from .env (loaded via env_file above) wins. The shipped
      # .env.example default points at the bundled `db` service so the
      # "cp .env.example .env && docker compose up" path works; operators
      # pointing at an external Postgres (RDS, Cloud SQL, on-prem) just
      # edit OPSMENDER_DATABASE_URL in .env.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    # Canonical entry point — backend API + static frontend on the same port.
    ports:
      - "8000:8000"
    volumes:
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
