[project]
name = "ai-incident-manager"
version = "1.0.0"
description = "AI-powered incident response framework with tiered access controls, MCP-first integrations, and human-in-the-loop approvals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SpicyDaemon"}]
keywords = ["incident-response", "sre", "devops", "mcp", "langgraph", "llm", "agents", "ai-ops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.0",
    "langgraph>=0.2",
    "anthropic>=0.93.0",
    "openai>=1.99.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "websockets>=15.0",
]

[project.scripts]
aim = "cli.aim:main"

[project.urls]
Homepage = "https://github.com/SpicyDaemon/OpsMender-AI"
Repository = "https://github.com/SpicyDaemon/OpsMender-AI"
Issues = "https://github.com/SpicyDaemon/OpsMender-AI/issues"
Changelog = "https://github.com/SpicyDaemon/OpsMender-AI/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "backend"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pylint",
    "black",
    "mypy",
    "aiosqlite",
    "httpx",
]
build = [
    "pyinstaller>=6.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live integration tests requiring K8s cluster + MCP server",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py311"]
