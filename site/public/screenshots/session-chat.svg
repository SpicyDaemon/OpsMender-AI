  <text x="302" y="260" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#3b82f6">Recommended remediation (Advisory — Tier 2)</text>
  <text x="302" y="280" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">1. Revert checkout-svc to v2.4.1 (last stable) via rollback pipeline</text>
  <text x="302" y="298" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">2. Run scale_deployment to add 3 replicas while rollback propagates</text>
  <text x="302" y="316" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">3. Monitor p99 on /api/checkout for 5 min post-rollout</text>
  <rect x="302" y="330" width="260" height="22" rx="4" fill="#f97316" fill-opacity="0.10" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
  <text x="432" y="345" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#fed7aa" text-anchor="middle">Advisory only — execute manually or switch to Tier 1</text>

