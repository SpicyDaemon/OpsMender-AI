  <!-- Workflow state pipeline -->
  <rect x="240" y="66" width="900" height="40" rx="6" fill="#111827" stroke="#1a2540" stroke-width="1"/>
  <!-- Steps -->
  <rect x="252" y="76" width="70" height="20" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
  <text x="287" y="91" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#86efac" text-anchor="middle">Observe ✓</text>
  <line x1="322" y1="86" x2="342" y2="86" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="342" y="76" width="70" height="20" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
  <text x="377" y="91" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#86efac" text-anchor="middle">Diagnose ✓</text>
  <line x1="412" y1="86" x2="432" y2="86" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="432" y="76" width="60" height="20" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
  <text x="462" y="91" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#86efac" text-anchor="middle">Plan ✓</text>
  <line x1="492" y1="86" x2="512" y2="86" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="512" y="74" width="80" height="24" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.5"/>
