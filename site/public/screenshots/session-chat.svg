  <text x="375" y="24" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#94a3b8">Session</text>
  <text x="240" y="44" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Production API p99 latency spike — session #7</text>

  <!-- Tier badge -->
  <rect x="1040" y="14" width="140" height="24" rx="12" fill="#1e3a5f" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
