[project]
name = "ai-incident-manager"
version = "0.1.0"
description = "AI Incident Manager - CLI and backend scaffolding"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.0",
    "langgraph>=0.2",
    "anthropic>=0.93.0",
    "openai>=1.99.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "websockets>=15.0",
]

[project.scripts]
aim = "cli.aim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "backend"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pylint",
    "black",
    "mypy",
    "aiosqlite",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live integration tests requiring K8s cluster + MCP server",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py311"]
