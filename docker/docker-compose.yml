services:
  # ── Postgres ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aim}
      POSTGRES_DB: aim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aim"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIM_DATABASE_URL: postgresql+asyncpg://aim:${POSTGRES_PASSWORD:-aim}@db:5432/aim
      AIM_CORS_ORIGINS: http://localhost:3000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    volumes:
      - ../logs:/app/logs

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
