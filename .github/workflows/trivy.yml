name: Container vulnerability scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build scan image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: opsmender:security-scan

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opsmender:security-scan
          trivy-config: trivy.yaml
          # The action's own ignore-unfixed input defaults to false and is
          # passed as an env var, which overrides trivy.yaml. Set it here so
          # unfixed/deferred base-image CVEs (no upstream patch available) do
          # not gate the build; we only fail on findings that have a fix.
          ignore-unfixed: true
