services:
  # ── Postgres ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: opsmender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsmender}
      POSTGRES_DB: opsmender
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmender"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The Postgres port is exposed on the host for dev convenience
    # (psql / pgAdmin / migration tooling without `docker exec`). For
    # production deployments, comment this out so Postgres is only
    # reachable from inside the compose network.
    ports:
      - "5432:5432"

  # ── App (frontend + backend, single container) ────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Empty = frontend calls the backend same-origin. Override if the
        # frontend is hosted separately from the backend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPSMENDER_DATABASE_URL: postgresql+asyncpg://opsmender:${POSTGRES_PASSWORD:-opsmender}@db:5432/opsmender
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    volumes:
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
