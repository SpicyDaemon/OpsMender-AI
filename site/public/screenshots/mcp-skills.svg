  <rect x="260" y="382" width="880" height="28" rx="4" fill="#0d1221"/>
  <rect x="268" y="390" width="50" height="12" rx="2" fill="#22c55e" fill-opacity="0.15"/>
  <text x="293" y="401" font-family="mono,sans-serif" font-size="10" fill="#86efac" text-anchor="middle">safe</text>
  <text x="330" y="401" font-family="mono,sans-serif" font-size="11" fill="#94a3b8">get_pod_logs</text>
  <text x="600" y="401" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#475569">Stream logs from a pod</text>

  <rect x="260" y="416" width="880" height="28" rx="4" fill="#111827"/>
  <rect x="268" y="424" width="60" height="12" rx="2" fill="#eab308" fill-opacity="0.15"/>
  <text x="298" y="435" font-family="mono,sans-serif" font-size="10" fill="#fef08a" text-anchor="middle">caution</text>
  <text x="342" y="435" font-family="mono,sans-serif" font-size="11" fill="#94a3b8">scale_deployment</text>
  <text x="600" y="435" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#475569">reversible: true</text>

  <rect x="260" y="450" width="880" height="28" rx="4" fill="#0d1221"/>
  <rect x="268" y="458" width="70" height="12" rx="2" fill="#ef4444" fill-opacity="0.15"/>
  <text x="303" y="469" font-family="mono,sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">destructive</text>
  <text x="352" y="469" font-family="mono,sans-serif" font-size="11" fill="#94a3b8">delete_pod</text>
  <text x="600" y="469" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#475569">Approval required at Tier 1</text>

  <rect x="260" y="484" width="880" height="28" rx="4" fill="#111827"/>
  <rect x="268" y="492" width="38" height="12" rx="2" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="287" y="503" font-family="mono,sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">deny</text>
  <text x="320" y="503" font-family="mono,sans-serif" font-size="11" fill="#94a3b8">shell</text>
  <text x="600" y="503" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#ef4444">Blocked at every tier — deny always wins</text>

  <rect x="260" y="518" width="880" height="28" rx="4" fill="#0d1221"/>
  <rect x="268" y="526" width="38" height="12" rx="2" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="287" y="537" font-family="mono,sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">deny</text>
  <text x="320" y="537" font-family="mono,sans-serif" font-size="11" fill="#94a3b8">exec_*</text>
  <text x="600" y="537" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#ef4444">Glob — all exec variants denied</text>

  <!-- safety note -->
  <rect x="260" y="562" width="880" height="36" rx="6" fill="#3b82f6" fill-opacity="0.06" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1"/>
  <text x="280" y="584" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#93c5fd">Skills guide the AI. The backend tier gate enforces what can actually run — not model reasoning.</text>
