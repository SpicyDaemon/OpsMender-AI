  <rect x="220" y="118" width="680" height="632" fill="#07090f" stroke="#1a2540" stroke-width="1"/>

  <!-- AI message 1 -->
  <rect x="240" y="136" width="36" height="36" rx="8" fill="#1e3a5f"/>
  <text x="258" y="159" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">AI</text>
  <rect x="286" y="136" width="580" height="90" rx="8" fill="#111827" stroke="#1a2540" stroke-width="1"/>
  <text x="302" y="156" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#3b82f6">Analysis complete</text>
  <text x="302" y="176" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">Root cause identified: p99 latency spike correlates with a deploy at 14:32 UTC.</text>
  <text x="302" y="194" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">The checkout-svc introduced a synchronous DB call in the hot path (commit a4f9c2e).</text>
  <text x="302" y="212" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#64748b">Severity: P0 · Blast radius: 100% of checkout flows · Estimated duration: 18 min</text>

  <!-- AI message 2 -->
  <rect x="240" y="240" width="36" height="36" rx="8" fill="#1e3a5f"/>
  <text x="258" y="263" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">AI</text>
