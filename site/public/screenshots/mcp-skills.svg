  <text x="1110" y="242" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Download</text>

  <!-- YAML editor / detail panel -->
  <rect x="240" y="296" width="920" height="380" rx="10" fill="#0d1221" stroke="#1a2540" stroke-width="1"/>
  <rect x="240" y="296" width="920" height="36" rx="10" fill="#111827" stroke="#1a2540" stroke-width="1"/>
  <text x="260" y="319" font-family="mono,sans-serif" font-size="12" fill="#94a3b8">k8s-production — structured operations</text>
  <rect x="1060" y="304" width="80" height="20" rx="4" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1100" y="318" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Save skill</text>

  <!-- Operation rows -->
  <rect x="260" y="348" width="880" height="28" rx="4" fill="#111827"/>
  <rect x="268" y="356" width="50" height="12" rx="2" fill="#22c55e" fill-opacity="0.15"/>
  <text x="293" y="367" font-family="mono,sans-serif" font-size="10" fill="#86efac" text-anchor="middle">safe</text>
  <text x="330" y="367" font-family="mono,sans-serif" font-size="11" fill="#94a3b8">get_pods</text>
